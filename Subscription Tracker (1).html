<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subscription Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
<style>
:root{--p:#006a6a;--on-p:#fff;--pc:#cce8e7;--on-pc:#002020;--tc:#ffdcc2;--on-tc:#2e1500;--surf:#f4fbfa;--sc:#e8efee;--ov:#3f4948;--os:#161d1d;--ol:#bec9c8;--er:#ba1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#4fd8d8;--on-p:#003737;--pc:#1f4e4d;--on-pc:#cce8e7;--tc:#4a2800;--on-tc:#ffdcc2;--surf:#0e1514;--sc:#1a2120;--ov:#bec9c8;--os:#dde4e3;--ol:#3f4948;--er:#ffb4ab}}
:root[data-theme="dark"]{--p:#4fd8d8;--on-p:#003737;--pc:#1f4e4d;--on-pc:#cce8e7;--tc:#4a2800;--on-tc:#ffdcc2;--surf:#0e1514;--sc:#1a2120;--ov:#bec9c8;--os:#dde4e3;--ol:#3f4948;--er:#ffb4ab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--surf);color:var(--os);font-family:Roboto,"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding:16px 16px 24px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0 16px}
.bar h1{flex:1;margin:0 8px;font-size:22px;font-weight:500}
.who{font-size:13px;color:var(--ov);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av svg{width:100%;height:100%;display:block}
.av.b{background:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.icrow{display:flex;align-items:center;gap:16px}
.icrow .av{width:56px;height:56px}
.icrow .hint{margin:8px 0 0;font-size:13px;color:var(--ov)}
.logo{flex:none}
.lg-bg{fill:var(--p)}
.lg-fg{fill:var(--on-p)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:28px}
.wm{font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.wm span{color:var(--p)}
.tag{font-size:14px;color:var(--ov)}
.auth .bar h1{text-align:center}
.auth{max-width:400px;margin:0 auto;padding-top:32px}
.auth .sub{margin:0 8px 24px;color:var(--ov)}
.auth .acts{justify-content:stretch}
.auth .acts .btn{width:100%;height:48px}
.auth .sw{text-align:center;margin:20px 0 8px;color:var(--ov)}
.auth .note{text-align:center;font-size:13px;color:var(--ov);margin:16px 8px 0}
.back{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--os);margin-left:-8px}
.back:hover{background:color-mix(in srgb,var(--p) 10%,transparent)}
.hero{background:var(--pc);color:var(--on-pc);border-radius:28px;padding:24px}
.hero p{margin:0;font-size:14px;font-weight:500}
.total{font-size:56px;line-height:1.15;margin:6px 0;font-variant-numeric:tabular-nums}
.next{margin:12px 0 24px;background:var(--sc);border-radius:16px;padding:14px 16px;font-size:15px}
.next.soon{background:var(--tc);color:var(--on-tc)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:0 8px 8px}
.head h2{margin:0;font-size:16px;font-weight:500}
.head span{font-size:14px;color:var(--ov)}
.list{list-style:none;margin:0;padding:0;background:var(--sc);border-radius:20px;overflow:hidden}
.list li{position:relative}
.list li+li::before{content:"";position:absolute;top:0;left:72px;right:16px;border-top:1px solid var(--ol)}
.list a{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:72px;color:inherit;text-decoration:none}
.list a:hover,.list a:focus-visible{background:color-mix(in srgb,var(--p) 10%,transparent);outline:none}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-weight:500}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:400;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--ov);font-size:14px}
.soon-tx small{color:var(--on-tc);font-weight:500}
.pr{font-weight:500;font-variant-numeric:tabular-nums}
.fabrow{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;margin-top:20px}
.fab{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--p);color:var(--on-p);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15)}
.btn{height:40px;padding:0 24px;border-radius:20px;border:0;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn.f{background:var(--p);color:var(--on-p)}
.btn.o{background:transparent;border:1px solid var(--ol);color:var(--p)}
.btn.o.d{color:var(--er)}
.btn.t{background:transparent;color:var(--p);padding:0 12px}
.fab:focus-visible,.btn:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.state{text-align:center;padding:56px 16px}
.state h2{margin:0 0 8px;font-size:24px;font-weight:500}
.state p{margin:0 0 24px;color:var(--ov)}
.state .row{display:flex;flex-direction:column;align-items:center;gap:8px}
.fld{margin-bottom:20px}
.fld label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.fld input{width:100%;height:52px;padding:0 16px;border:1px solid var(--ol);border-radius:12px;background:transparent;color:var(--os);font-family:inherit;font-size:16px}
.fld input:focus{outline:2px solid var(--p);border-color:var(--p)}
.fld input[aria-invalid]{border-color:var(--er);outline-color:var(--er)}
.er{margin:6px 4px 0;color:var(--er);font-size:13px}
.acts{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}
.dlg.help{max-height:calc(100% - 48px);overflow:auto}
.dlg ol{margin:12px 0 0;padding-left:20px;color:var(--ov)}
.dlg ol li{margin-bottom:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;z-index:10}
.dlg{background:var(--sc);border-radius:28px;padding:24px;max-width:360px;width:100%}
.dlg h2{margin:0 0 8px;font-size:22px;font-weight:500}
.dlg p{margin:0;color:var(--ov)}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const KEY='subtrack.v1',UK='subtrack.users',SK='subtrack.session';
const MO=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let draftIcon,curSub=null,helpOpen=false,user=null,authMode='login',authErr=null,subs=[],err=false,form=null,delId=null;
const baht=n=>'฿'+Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtD=d=>`${d.getDate()} ${MO[d.getMonth()]}`;

const memD={};
const dk=()=>KEY+'.'+user;
const rd=k=>{try{return localStorage.getItem(k)}catch(e){return memD[k]??null}};
const wr=(k,v)=>{memD[k]=v;try{localStorage.setItem(k,v)}catch(e){}};
function load(){
  const raw=rd(dk());
  try{subs=raw?JSON.parse(raw):[];if(!Array.isArray(subs))throw 0;err=false}catch(e){subs=[];err=true}
}
function save(){wr(dk(),JSON.stringify(subs))}
const users=()=>{try{return JSON.parse(rd(UK))||{}}catch(e){return {}}};
async function hash(salt,pw){
  const t=salt+':'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}
}
user=(()=>{const u=rd(SK);return u&&users()[u]?u:null})();

// วันตัดเงินครั้งถัดไป (ถ้าเดือนนั้นไม่มีวันที่ 31 ใช้วันสุดท้ายของเดือนแทน)
function nextDate(day){
  const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  for(let i=0;i<3;i++){
    const b=new Date(t.getFullYear(),t.getMonth()+i,1);
    const dim=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
    const d=new Date(b.getFullYear(),b.getMonth(),Math.min(day,dim));
    if(d>=t)return d;
  }
}
const daysTo=d=>{const n=new Date();return Math.round((d-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
const inTxt=k=>k===0?'วันนี้':k===1?'พรุ่งนี้':`อีก ${k} วัน`;

const mark=z=>`<svg class="logo" width="${z}" height="${z}" viewBox="0 0 48 48" role="img" aria-label="SubTrack"><rect width="48" height="48" rx="14" class="lg-bg"/><g transform="translate(8 8) scale(1.3333)"><path class="lg-fg" d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></g><circle cx="24" cy="24" r="3.5" class="lg-fg"/></svg>`;
const back='<a class="back" href="#/" aria-label="กลับหน้าแรก"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></a>';
const bar=(t,b,r='')=>`<div class="bar">${b?back:mark(36)}<h1>${t}</h1>${r}</div>`;
const out=()=>`<span class="who">${esc(user)}</span><button class="btn t" data-act="logout">ออกจากระบบ</button>`;

const T=(t,c,z=24)=>`<text x="20" y="${z+4}" font-size="${z}" font-weight="700" text-anchor="middle" fill="${c}" font-family="Roboto,Arial,sans-serif">${t}</text>`;
const BR=[
 {k:['netflix'],bg:'#000',i:T('N','#e50914')},
 {k:['spotify'],bg:'#1db954',i:'<g fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><path d="M10 15c7-2 14-1 20 2"/><path d="M11 21c6-1.6 12-1 17 2"/><path d="M12 27c5-1.2 9-.8 13 1.4"/></g>'},
 {k:['youtube'],bg:'#fff',i:'<rect x="6" y="11" width="28" height="18" rx="5" fill="#f00"/><path d="M17 16l8 4-8 4z" fill="#fff"/>'},
 {k:['chatgpt','openai'],bg:'#10a37f',i:'<path d="M20 9l9 5v12l-9 5-9-5V14z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><circle cx="20" cy="20" r="3" fill="#fff"/>'},
 {k:['icloud','apple'],bg:'#3693f3',i:'<path d="M13 28a5 5 0 0 1-.5-9.9A7 7 0 0 1 26 16a6 6 0 0 1 1 12z" fill="#fff"/>'},
 {k:['disney'],bg:'#113ccf',i:T('D+','#fff',16)},
 {k:['canva'],bg:'#00c4cc',i:T('C','#fff',24)}
];
const avatar=s=>{
  const n=(s.name||'').toLowerCase();
  if(s.icon&&/^data:image\//.test(s.icon))return `<span class="av b"><img src="${esc(s.icon)}" alt=""></span>`;
  const b=BR.find(x=>x.k.some(w=>n.includes(w)));
  if(b)return `<span class="av b"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="${b.bg}"/>${b.i}</svg></span>`;
  return `<span class="av">${esc((s.name||'?')[0].toUpperCase())}</span>`;
};
const curIcon=()=>draftIcon!==undefined?draftIcon:(curSub&&curSub.icon)||'';
const iconRow=(name,icon)=>`<div class="fld"><label>โลโก้บริการ</label><div class="icrow"><span id="ic-prev">${avatar({name,icon})}</span><div><button class="btn o" data-act="pick-icon" type="button">อัปโหลดรูปโลโก้</button>${icon?'<button class="btn t" data-act="clear-icon" type="button">ลบรูป</button>':''}<p class="hint">ถ้าชื่อเป็น Netflix, Spotify, YouTube, ChatGPT, iCloud, Disney+ หรือ Canva ระบบจะใส่ไอคอนให้เอง</p></div></div><input type="file" id="f-icon" accept="image/*" hidden></div>`;

function dashboard(){
  const list=subs.map(s=>({...s,next:nextDate(s.day)})).sort((a,b)=>a.next-b.next);
  if(!list.length)return bar('ค่าสมัครสมาชิก',false,out())+`<div class="state"><h2>ยังไม่มีรายการ</h2><p>เพิ่มบริการที่สมัครไว้ แล้วดูว่าเดือนนี้ต้องจ่ายเท่าไหร่</p><div class="row"><button class="btn f" data-act="add">เพิ่มรายการแรก</button><button class="btn t" data-act="help">ดูวิธีการใช้งานเบื้องต้น</button></div></div>`;
  const total=list.reduce((a,s)=>a+s.price,0),n=list[0],k=daysTo(n.next),now=new Date();
  return bar('ค่าสมัครสมาชิก',false,out())+`
<div class="hero"><p>ต้องจ่ายเดือนนี้ (${MO[now.getMonth()]} ${now.getFullYear()})</p><div class="total">${baht(total)}</div><p>เทียบเป็นรายปี ${baht(total*12)}</p></div>
<div class="next${k<=3?' soon':''}"><b>${inTxt(k)}</b> ${esc(n.name)} ตัดเงิน ${baht(n.price)}</div>
<div class="head"><h2>รายการทั้งหมด</h2><span>${list.length} รายการ</span></div>
<ul class="list">${list.map(s=>{const d=daysTo(s.next);return `<li><a href="#/item/${s.id}">${avatar(s)}<div class="tx${d<=3?' soon-tx':''}"><b>${esc(s.name)}</b><small>ตัดเงิน ${fmtD(s.next)} · ${inTxt(d)}</small></div><div class="pr">${baht(s.price)}</div></a></li>`}).join('')}</ul>
<div class="fabrow"><button class="fab" data-act="add"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>เพิ่มรายการ</button></div>`;
}

const field=(id,lb,type,v,e,ph,extra='')=>`<div class="fld"><label for="${id}">${lb}</label><input id="${id}" type="${type}" value="${esc(v)}" placeholder="${ph}" ${extra}${e?' aria-invalid="true"':''}>${e?`<p class="er">${e}</p>`:''}</div>`;

function formView(s){
  const f=form||{vals:s?{name:s.name,price:s.price,date:iso(nextDate(s.day))}:{name:'',price:'',date:''},errs:{}};
  const v=f.vals,e=f.errs,id=s?s.id:'';curSub=s;const icon=curIcon();
  return bar(s?esc(s.name):'เพิ่มรายการ',true)+iconRow(v.name,icon)+
    field('f-name','ชื่อบริการ','text',v.name,e.name,'เช่น Netflix')+
    field('f-price','ราคาต่อเดือน (บาท)','text',v.price,e.price,'เช่น 349','inputmode="decimal"')+
    field('f-date','วันตัดเงินครั้งถัดไป','date',v.date,e.date,'')+
    `<div class="acts">${s?`<button class="btn o d" data-act="ask-del" data-id="${id}">ลบรายการ</button>`:'<button class="btn o" data-act="cancel">ยกเลิก</button>'}<button class="btn f" data-act="save" data-id="${id}">บันทึก</button></div>`;
}

function errorView(){
  return bar('ค่าสมัครสมาชิก',false,out())+`<div class="state"><h2>โหลดข้อมูลไม่ได้</h2><p>ข้อมูลที่บันทึกไว้อ่านไม่ได้ ลองโหลดอีกครั้ง หรือล้างข้อมูลแล้วเริ่มใหม่</p><div class="row"><button class="btn f" data-act="retry">ลองใหม่</button><button class="btn t" data-act="reset">ล้างข้อมูลแล้วเริ่มใหม่</button></div></div>`;
}

function helpView(){
  return `<div class="scrim"><div class="dlg help" role="dialog" aria-modal="true"><h2>วิธีใช้งานเบื้องต้น</h2><ol>
<li>กด <b>เพิ่มรายการแรก</b> แล้วกรอกชื่อบริการ ราคาต่อเดือน และวันตัดเงินครั้งถัดไป</li>
<li>ถ้าชื่อเป็นบริการยอดนิยม เช่น Netflix หรือ Spotify ระบบจะใส่ไอคอนให้เอง หรือกด <b>อัปโหลดรูปโลโก้</b> เพื่อใช้รูปของคุณ</li>
<li>กด <b>บันทึก</b> หน้าแรกจะแสดงยอดรวมที่ต้องจ่ายเดือนนี้ และรายการเรียงตามวันตัดเงิน</li>
<li>แถบใต้ยอดรวมบอกรายการที่ตัดเงินถัดไป ถ้าเหลือไม่เกิน 3 วันจะเป็นสีส้ม</li>
<li>กดที่แถวรายการเพื่อแก้ไขหรือลบ การลบจะมีหน้าต่างให้ยืนยันก่อน</li>
<li>เมื่อใช้เสร็จกด <b>ออกจากระบบ</b> ข้อมูลของแต่ละบัญชีแยกกัน</li></ol>
<div class="acts"><button class="btn f" data-act="close-help">เข้าใจแล้ว</button></div></div></div>`;
}

function loginView(){
  const reg=authMode==='register',f=authErr||{vals:{u:''},errs:{}},e=f.errs;
  return `<div class="auth"><div class="brand">${mark(72)}<div class="wm">Sub<span>Track</span></div><div class="tag">ตัวติดตามค่าสมัครสมาชิก</div></div><div class="bar"><h1>${reg?'สร้างบัญชี':'เข้าสู่ระบบ'}</h1></div>
<p class="sub">${reg?'สมัครบัญชีเพื่อเก็บรายการสมาชิกของคุณ':'เข้าสู่ระบบเพื่อดูรายการสมาชิกของคุณ'}</p>`+
  field('a-user','ชื่อผู้ใช้','text',f.vals.u,e.u,'อย่างน้อย 3 ตัวอักษร','autocomplete="username" autocapitalize="none"')+
  field('a-pass','รหัสผ่าน','password','',e.p,'อย่างน้อย 6 ตัวอักษร',`autocomplete="${reg?'new-password':'current-password'}"`)+
  (reg?field('a-pass2','ยืนยันรหัสผ่าน','password','',e.p2,'พิมพ์รหัสผ่านอีกครั้ง','autocomplete="new-password"'):'')+
  `<div class="acts"><button class="btn f" data-act="${reg?'register':'login'}">${reg?'สมัครและเข้าใช้งาน':'เข้าสู่ระบบ'}</button></div>
<p class="sw">${reg?'มีบัญชีอยู่แล้ว?':'ยังไม่มีบัญชี?'} <button class="btn t" data-act="toggle-auth">${reg?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button></p>
<p class="note">บัญชีนี้เก็บอยู่ในเบราว์เซอร์ของเครื่องนี้เท่านั้น เป็นระบบจำลองสำหรับโปรเจค</p></div>`;
}

function render(){
  if(!user){document.getElementById('app').innerHTML=loginView();return}
  load();
  const h=location.hash||'#/',m=h.match(/^#\/item\/(.+)$/);
  let html;
  if(err)html=errorView();
  else if(h==='#/add')html=formView(null);
  else if(m){const s=subs.find(x=>x.id===m[1]);html=s?formView(s)+(delId===s.id?`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true"><h2>ลบรายการนี้ใช่ไหม?</h2><p>${esc(s.name)} จะถูกลบออกจากรายการ</p><div class="acts"><button class="btn t" data-act="cancel-del">ยกเลิก</button><button class="btn t" style="color:var(--er)" data-act="confirm-del" data-id="${s.id}">ลบ</button></div></div></div>`:''):dashboard()}
  else html=dashboard();
  document.getElementById('app').innerHTML=html+(helpOpen?helpView():'');
}
function go(h){const cur=location.hash||'#/';if(cur===h||(h==='#/'&&(cur==='#'||cur===''))){form=null;delId=null;helpOpen=false;draftIcon=undefined;render()}else location.hash=h}
addEventListener('hashchange',()=>{form=null;delId=null;helpOpen=false;draftIcon=undefined;render()});

document.getElementById('app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,val=i=>document.getElementById(i).value;
  if(a==='toggle-auth'){authMode=authMode==='login'?'register':'login';authErr=null;return render()}
  if(a==='logout'){user=null;wr(SK,'');authMode='login';authErr=null;subs=[];return go('#/')}
  if(a==='login'||a==='register'){
    const u=val('a-user').trim().toLowerCase(),p=val('a-pass'),errs={},all=users();
    if(a==='register'){
      if(u.length<3)errs.u='ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร';
      else if(all[u])errs.u='ชื่อผู้ใช้นี้ถูกใช้แล้ว';
      if(p.length<6)errs.p='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      else if(p!==val('a-pass2'))errs.p2='รหัสผ่านไม่ตรงกัน';
      if(Object.keys(errs).length){authErr={vals:{u},errs};return render()}
      const salt=Math.random().toString(36).slice(2);
      all[u]={salt,hash:await hash(salt,p)};wr(UK,JSON.stringify(all));
    }else{
      const rec=all[u];
      if(!u||!p||!rec||rec.hash!==await hash(rec.salt,p)){authErr={vals:{u},errs:{p:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}};return render()}
    }
    user=u;wr(SK,u);authErr=null;return go('#/');
  }
  if(a==='add')go('#/add');
  else if(a==='cancel')go('#/');
  else if(a==='retry')render();
  else if(a==='reset'){wr(dk(),'');render()}
  else if(a==='pick-icon')document.getElementById('f-icon').click();
  else if(a==='clear-icon'){form={vals:{name:val('f-name'),price:val('f-price'),date:val('f-date')},errs:{}};draftIcon='';render()}
  else if(a==='help'){helpOpen=true;render()}
  else if(a==='close-help'){helpOpen=false;render()}
  else if(a==='ask-del'){delId=id;render()}
  else if(a==='cancel-del'){delId=null;render()}
  else if(a==='confirm-del'){subs=subs.filter(x=>x.id!==id);save();delId=null;go('#/')}
  else if(a==='save'){
    const vals={name:val('f-name').trim(),price:val('f-price').trim(),date:val('f-date')},errs={},pr=Number(vals.price);
    if(!vals.name)errs.name='กรอกชื่อบริการ';
    if(!vals.price||!isFinite(pr)||pr<=0)errs.price='ราคาต้องเป็นตัวเลขมากกว่า 0';
    if(!vals.date||isNaN(new Date(vals.date)))errs.date='เลือกวันตัดเงิน';
    if(Object.keys(errs).length){form={vals,errs};return render()}
    const day=Number(vals.date.split('-')[2]),ic=curIcon();
    if(id){Object.assign(subs.find(x=>x.id===id),{name:vals.name,price:pr,day,icon:ic})}
    else subs.push({id:Date.now().toString(36),name:vals.name,price:pr,day,icon:ic});
    save();go('#/');
  }
});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=document.querySelector('.acts .btn.f');if(b){e.preventDefault();b.click()}}});
document.getElementById('app').addEventListener('input',e=>{
  if(e.target.id==='f-name'){const pv=document.getElementById('ic-prev');if(pv)pv.innerHTML=avatar({name:e.target.value,icon:curIcon()})}
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id!=='f-icon'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=96;
      const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);
      const g=i=>document.getElementById(i).value;
      form={vals:{name:g('f-name'),price:g('f-price'),date:g('f-date')},errs:{}};
      draftIcon=c.toDataURL('image/png');render();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(e.target.files[0]);
});
render();
</script>
</body>
